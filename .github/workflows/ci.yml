name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  server:
    name: Server — typecheck and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: server/package-lock.json

      # The tests run against an in-memory MongoDB, whose binary is downloaded
      # on first use. Cached so every run after the first does not fetch it.
      - name: Cache the mongodb-memory-server binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}

      - run: npm ci
        working-directory: server

      - run: npm run typecheck
        working-directory: server

      - run: npm test
        working-directory: server

  web:
    name: Web — build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
        working-directory: web

      # next build type-checks and lints the whole app on the way through.
      - run: npm run build
        working-directory: web
